  <script>
    function getParameterByName(name) {
      name = name.replace(/[\[\]]/g, '\\$&');
      var url = window.location.href;
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
          results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    function openAppOrRedirect() {
      const nombre = getParameterByName('nombre');
      if (!nombre) return; // No parámetro, no hacer nada

      const appLink = `notaliturgica://reproducir?nombre=${encodeURIComponent(nombre)}`;
      const playStore = 'https://play.google.com/store/apps/details?id=tu.paquete.app'; // Cambia por el ID real de tu app

      // Intenta abrir la app
      window.location = appLink;

      // Si no abre en 2 seg, redirige a Play Store
      setTimeout(() => {
        window.location = playStore;
      }, 2000);
    }

    window.onload = openAppOrRedirect;
  </script>
